kind = "web"
previewPath = "/"
title = "InstaPop"
description = "InstaPop é um mapa interativo onde a comunidade movimenta a popularidade de pessoas, criadores e marcas em tempo real, com filtros, categorias e ações visuais."
version = "1.0.0"
id = "artifacts/pop-person"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/pop-person run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pop-person", "run", "build" ]
serve = "static"
publicDir = "artifacts/pop-person/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
